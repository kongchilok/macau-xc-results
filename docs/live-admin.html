<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0e12">
<title>終點輸入</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="live-admin.css?v=20261123d">
</head>
<body>
<header class="top">
  <b>終點輸入</b>
  <span id="sync" class="sync">未登入</span>
  <button id="logout" class="ghost" hidden>登出</button>
</header>

<!-- 登入 -->
<section id="login" class="panel">
  <h1>工作人員登入</h1>
  <p class="muted">只限獲授權的工作人員。帳戶由網站管理員建立。</p>
  <label>電郵<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>密碼<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="loginBtn" class="primary">登入</button>
  <p id="loginMsg" class="msg" role="alert"></p>
  <hr>
  <a class="practice-link" href="live-admin.html?practice=1">練習模式（不需登入，以第 47 屆成績模擬多圈比賽）›</a>
</section>

<!-- 主畫面 -->
<main id="app" hidden>
  <section class="bar">
    <select id="event" aria-label="資料">
      <option value="48">正式（第 48 屆）</option>
      <option value="test">演練（不公開）</option>
    </select>
    <div id="cats" class="cats" role="tablist" aria-label="組別"></div>
    <div id="heats" class="heats" aria-label="分組"></div>
  </section>

  <section id="practiceBar" class="practice" hidden>
    <div class="p-head"><b>練習模式</b><label class="p-speed">倍速<select id="pSpeed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><span id="pScore"></span></div>
    <div id="passing" class="passing" aria-live="polite"></div>
  </section>

  <section class="clock">
    <div><b id="clock">0:00.0</b><small id="cut"></small></div>
    <div class="clock-btns">
      <button id="startBtn" class="go">開賽計時</button>
      <button id="doneBtn" class="ghost" hidden>本組完成</button>
      <button id="adjBtn" class="ghost" hidden>修正起跑</button>
    </div>
  </section>

  <section class="entry">
    <div class="display">
      <span id="bib" class="bib" aria-live="polite"></span>
      <span id="who" class="who">輸入號碼布</span>
    </div>
    <div class="list">
      <div class="list-head"><div id="listTabs" class="list-tabs" role="tablist"></div><button id="lockBtn" class="ghost lock">鎖定排序</button></div>
      <p id="slotNote" class="slot-note" hidden></p>
      <ol id="list"></ol>
    </div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="fn">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">確認</button>
    </div>
    <div class="extra">
      <button id="markBtn" class="mark">⏱ 先記時間</button>
      <button id="schoolBtn" class="ghost">看不到號碼：按學校</button>
      <button id="undoBtn" class="undo" disabled>↶ 撤銷上一下</button>
    </div>
  </section>

</main>

<!-- 學校選擇／修改 -->
<dialog id="sheet"><form method="dialog" id="sheetBody"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="live-core.js?v=20261123d"></script>
<script src="live-admin.js?v=20261123e"></script>
</body>
</html>
